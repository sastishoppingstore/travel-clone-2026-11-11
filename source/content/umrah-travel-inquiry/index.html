<script>

/////////////////////
document.addEventListener('DOMContentLoaded', function() {
  var customizeUmrah = document.getElementById('customize_umrah');
  var additionalInfo = document.getElementById('additional_info');
  var umrahGroups = document.getElementById('umrah_groups');
  var errorMessage = document.getElementById('error_message');

  function updateFields() {
    if (customizeUmrah.value === 'yes') {
      additionalInfo.style.display = 'block';
      umrahGroups.style.display = 'none';
    } else {
      additionalInfo.style.display = 'none';
      umrahGroups.style.display = 'block';
    }
    errorMessage.style.display = 'none'; // Hide error message when updating fields
  }

  function validateForm() {
    errorMessage.style.display = 'none'; // Hide error message initially

    if (customizeUmrah.value === 'yes') {
      var departureDate = document.getElementById('departure_date').value;
      var returnDate = document.getElementById('return_date').value;
      if (!departureDate || !returnDate) {
        errorMessage.textContent = 'Please select both departure and return dates.';
        errorMessage.style.display = 'block';
        return false;
      }
    } else {
      var umrahGroup = document.getElementById('umrah_group').value;
      if (!umrahGroup) {
        errorMessage.textContent = 'Please select an Umrah group.';
        errorMessage.style.display = 'block';
        return false;
      }
    }
    return true; // Return true if validation passes
  }

  // Initial call to set the correct state on page load
  updateFields();

  customizeUmrah.addEventListener('change', updateFields);
});

</script>				</div>
